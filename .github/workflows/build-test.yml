name: Build, Test & Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
         dotnet-version: 10.0.x
    - name: Install dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build SS14.Launcher.sln --configuration Debug --no-restore
    - name: SS14.Launcher.Tests
      run: dotnet test SS14.Launcher.sln --configuration Debug --no-build --no-restore -v n

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mados.Launcher
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: Mados.Launcher/package-lock.json
    - run: npm ci
    - run: npm run typecheck
    - run: npm test -- --run
    - run: npm run build

  package-windows:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, frontend]
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Mados.Launcher
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: Mados.Launcher/package-lock.json
    - run: npm ci
    - run: npm run build
    - name: Stage Debug worker
      shell: pwsh
      run: |
        $env:MADOS_WORKER_CONFIGURATION = "Debug"
        $env:MADOS_WORKER_RID = "win-x64"
        npm run prepare-worker
    - name: Package Windows Debug build
      shell: pwsh
      run: npx electron-builder --dir --win --x64 --config.directories.output=../artifacts/ci-win
    - uses: actions/upload-artifact@v4
      with:
        name: mados-launcher-windows-debug
        path: artifacts/ci-win/win-unpacked
