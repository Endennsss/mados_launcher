name: Publish Mados Launcher Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing version tag to build and publish (leave empty for build only)'
        type: string
        required: false
        default: ''

env:
  MADOS_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            rid: win-x64
            platform: win
            arch: x64
          - name: windows-arm64
            os: windows-2022
            rid: win-arm64
            platform: win
            arch: arm64
          - name: linux-x64
            os: ubuntu-22.04
            rid: linux-x64
            platform: linux
            arch: x64
          - name: linux-arm64
            os: ubuntu-22.04
            rid: linux-arm64
            platform: linux
            arch: arm64
          - name: macos-x64
            os: macos-15-intel
            rid: osx-x64
            platform: mac
            arch: x64
          - name: macos-arm64
            os: macos-15
            rid: osx-arm64
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Mados.Launcher
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Mados.Launcher/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify tag matches launcher version
        if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
        run: node -e "const version=require('./package.json').version; if(process.env.MADOS_RELEASE_TAG !== 'v'+version) throw Error('Update package.json version before tagging a release');"
      - name: Build frontend
        run: npm run build
      - name: Stage Release worker and Loader
        env:
          MADOS_WORKER_CONFIGURATION: Release
          MADOS_WORKER_RID: ${{ matrix.rid }}
        run: npm run prepare-worker
      - name: Package release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never --config.directories.output=../artifacts/mados-release-${{ matrix.name }}
      - name: Write Windows updater checksums
        if: matrix.platform == 'win'
        run: node tools/release-checksums.mjs ../artifacts/mados-release-${{ matrix.name }}
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mados-release-${{ matrix.name }}
          if-no-files-found: error
          path: |
            artifacts/mados-release-${{ matrix.name }}/Mados*
            artifacts/mados-release-${{ matrix.name }}/latest*.yml

  installer:
    name: Build Windows installer
    runs-on: windows-2022
    defaults:
      run:
        working-directory: Mados.Installer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Mados.Installer/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package bootstrap installer (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win --x64 --config electron-builder.yml --publish never --config.directories.output=../artifacts/mados-release-installer
      - run: node scripts/verify-package.mjs ../artifacts/mados-release-installer/win-unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: mados-release-installer
          if-no-files-found: error
          path: artifacts/mados-release-installer/Mados.Installer.Windows.x64.exe

  publish:
    name: Publish GitHub release
    needs: [build, installer]
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Mados.Launcher/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: Mados.Launcher
      - run: node --test tools/assemble-release.test.mjs
        working-directory: Mados.Launcher
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mados-release-*
          path: release-assets
      - name: Verify artifacts and merge architecture update manifests
        env:
          RELEASE_TAG: ${{ env.MADOS_RELEASE_TAG }}
        run: node Mados.Launcher/tools/assemble-release.mjs release-assets release-upload "${RELEASE_TAG#v}"
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.MADOS_RELEASE_TAG }}
        run: |
          set -euo pipefail
          notes="docs/releases/${RELEASE_TAG}.md"
          test -f "$notes"
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            test "$(cat release-state.txt)" = true || { echo 'Refusing to overwrite a published release'; exit 1; }
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Mados Launcher $RELEASE_TAG" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" release-upload/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest --title "Mados Launcher $RELEASE_TAG" --notes-file "$notes"
