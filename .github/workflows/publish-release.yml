name: Publish Mados Launcher Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
            rid: win-x64
            platform: win
            arch: x64
          - name: windows-arm64
            os: windows-2022
            rid: win-arm64
            platform: win
            arch: arm64
          - name: linux-x64
            os: ubuntu-22.04
            rid: linux-x64
            platform: linux
            arch: x64
          - name: linux-arm64
            os: ubuntu-22.04
            rid: linux-arm64
            platform: linux
            arch: arm64
          - name: macos-x64
            os: macos-13
            rid: osx-x64
            platform: mac
            arch: x64
          - name: macos-arm64
            os: macos-14
            rid: osx-arm64
            platform: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: Mados.Launcher
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Mados.Launcher/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Stage Release worker and Loader
        env:
          MADOS_WORKER_CONFIGURATION: Release
          MADOS_WORKER_RID: ${{ matrix.rid }}
        run: npm run prepare-worker
      - name: Package release
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never --config.directories.output=../artifacts/mados-release-${{ matrix.name }}
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mados-release-${{ matrix.name }}
          if-no-files-found: error
          path: |
            artifacts/mados-release-${{ matrix.name }}/Mados*
            artifacts/mados-release-${{ matrix.name }}/latest*.yml

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mados-release-*
          path: release-assets
      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mados Launcher ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/**/Mados*
            release-assets/**/latest*.yml
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
